name: Release

on:
  push:
    tags: ["v*.*.*"]

# contents: the GitHub release assets. packages: GHCR. id-token: the provenance
# and SBOM attestations below.
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - run: make release VERSION=${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  image:
    name: Build & Push
    # The same shared workflow openldap-docker uses, so both products publish
    # identically. Docker Hub namespace defaults to the repository owner,
    # lowercased: vibhuvioio.
    uses: VibhuviOiO/github-engineering/.github/workflows/container-publish.yml@main
    with:
      image-name: openldap-exporter
      platforms: linux/amd64,linux/arm64
      ghcr-enabled: true
      dockerhub-enabled: true
      provenance: true
      sbom: true
      build-args: |
        VERSION=${{ github.ref_name }}
        REVISION=${{ github.sha }}
      tags: |
        type=raw,value=latest
        type=semver,pattern={{version}}
        type=sha,prefix=
    secrets: inherit
