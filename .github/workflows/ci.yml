name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            echo "::error::gofmt found unformatted files (run 'gofmt -w .')"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          # 2024.1.1 pulls x/tools v0.21, which does not compile under Go 1.27
          version: "2026.2.1"

      - name: test
        run: go test -race -cover -coverprofile=coverage.out ./...

      - name: build (host)
        run: go build ./...

  cross-build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -o /dev/null ./cmd/openldap-exporter

  config-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"

      - name: build
        run: go build -o /tmp/openldap-exporter ./cmd/openldap-exporter

      - name: validate example config
        run: /tmp/openldap-exporter -config openldap-exporter.example.yml -check

      - name: prometheus/promtool check rules
        uses: docker://prom/prometheus:latest
        with:
          entrypoint: promtool
          args: check rules /github/workspace/alerts/openldap.rules.yml

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build image (not pushed)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: openldap-exporter:ci
